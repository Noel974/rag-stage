name: rag-kestra

volumes:
  postgres-data:
    driver: local
  kestra-data:
    driver: local
  pgvector-data:
    driver: local

networks:
  RAG_kestra-net:
    driver: bridge

services:
  pgvector:
    image: ankane/pgvector:latest
    container_name: rag_pgvector
    environment:
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
      POSTGRES_DB: kestra
    ports:
      - "5433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - RAG_kestra-net

  postgres:
    image: postgres:18
    container_name: rag_kestra_postgres
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: k3str4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - RAG_kestra-net

  kestra:
    image: kestra/kestra:v1.3.35
    pull_policy: missing
    container_name: rag_kestra
    stop_grace_period: 6m
    user: "root"
    command: server standalone
    env_file:
      - .env
    volumes:
      - ./donnee:/app/data
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      KESTRA_CONFIGURATION: |
        SLACK_BOT_TOKEN: $${SLACK_BOT_TOKEN}
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: k3str4
        kestra:
          server:
            basic-auth:
              username: admin@kestra.io
              password: Admin1234!
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    networks:
      - RAG_kestra-net